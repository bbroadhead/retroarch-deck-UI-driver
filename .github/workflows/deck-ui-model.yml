name: Deck UI navigation model
on:
  push:
    branches: [deck-ui]
    paths:
      - 'menu/drivers/deck_ui_model.h'
      - 'menu/drivers/deck_ui_recent.h'
      - 'menu/drivers/deck_ui_achievements.h'
      - 'menu/drivers/deck_ui_layout.h'
      - 'tests-other/deck_ui_model_test.c'
      - 'tests-other/deck_ui_recent_test.c'
      - 'tests-other/deck_ui_achievements_test.c'
      - 'tests-other/deck_ui_layout_test.c'
      - '.github/workflows/deck-ui-model.yml'
  pull_request:
    paths:
      - 'menu/drivers/deck_ui_model.h'
      - 'menu/drivers/deck_ui_recent.h'
      - 'menu/drivers/deck_ui_achievements.h'
      - 'menu/drivers/deck_ui_layout.h'
      - 'tests-other/deck_ui_model_test.c'
      - 'tests-other/deck_ui_recent_test.c'
      - 'tests-other/deck_ui_achievements_test.c'
      - 'tests-other/deck_ui_layout_test.c'
      - '.github/workflows/deck-ui-model.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile navigation model with strict warnings
        run: cc -std=c99 -Wall -Wextra -Werror -pedantic -o /tmp/deck_ui_model_test tests-other/deck_ui_model_test.c
      - name: Run navigation model smoke tests
        run: /tmp/deck_ui_model_test
      - name: Compile recent-content model
        run: cc -std=c99 -Wall -Wextra -Werror -pedantic -o /tmp/deck_ui_recent_test tests-other/deck_ui_recent_test.c
      - name: Run recent-content tests
        run: /tmp/deck_ui_recent_test
      - name: Compile achievement view model
        run: cc -std=c99 -Wall -Wextra -Werror -pedantic -o /tmp/deck_ui_achievements_test tests-other/deck_ui_achievements_test.c
      - name: Run achievement view tests
        run: /tmp/deck_ui_achievements_test
      - name: Compile layout geometry tests
        run: cc -std=c99 -Wall -Wextra -Werror -pedantic -o /tmp/deck_ui_layout_test tests-other/deck_ui_layout_test.c
      - name: Run layout geometry tests
        run: /tmp/deck_ui_layout_test
