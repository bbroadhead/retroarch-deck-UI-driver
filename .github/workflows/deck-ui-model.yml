name: Deck UI navigation model
on:
  push:
    branches: [deck-ui]
    paths:
      - 'menu/drivers/deck_ui_model.h'
      - 'tests-other/deck_ui_model_test.c'
      - '.github/workflows/deck-ui-model.yml'
  pull_request:
    paths:
      - 'menu/drivers/deck_ui_model.h'
      - 'tests-other/deck_ui_model_test.c'
      - '.github/workflows/deck-ui-model.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile navigation model with strict warnings
        run: cc -std=c99 -Wall -Wextra -Werror -pedantic -o /tmp/deck_ui_model_test tests-other/deck_ui_model_test.c
      - name: Run navigation model smoke tests
        run: /tmp/deck_ui_model_test
